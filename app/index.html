<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphSense - Universal Entity Explorer</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* ============= CSS Variables (Theme System) ============= */
    :root {
      /* Colors */
      --color-primary: #0e639c;
      --color-accent: #0098ff;
      --color-success: #4ec9b0;
      --color-warning: #dcdcaa;
      --color-error: #f48771;
      --color-info: #4fc1ff;

      /* Light Mode */
      --bg-primary: #ffffff;
      --bg-secondary: var(--gs-sideBar-background, #f3f3f3);
      --bg-tertiary: #ececec;
      --text-primary: #333333;
      --text-secondary: #666666;
      --text-tertiary: #999999;
      --border-color: #d4d4d4;
      --hover-bg: #f0f0f0;

      /* Spacing */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --spacing-xl: 24px;
      --spacing-2xl: 32px;

      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --font-mono: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Courier New', monospace;
      --font-size-sm: 12px;
      --font-size-base: 13px;
      --font-size-md: 14px;
      --font-size-lg: 16px;
      --font-size-xl: 18px;
      --line-height-base: 1.5;
      --line-height-tight: 1.25;

      /* Layout */
      --sidebar-width: 250px;
      --sidebar-collapsed-width: 50px;
      --editor-width: 400px;
      --panel-width: 300px;
      --header-height: 40px;
      --tab-height: 35px;
      --border-radius: 4px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Dark Mode */
    body.dark-mode {
      --bg-primary: #1e1e1e;
      --bg-secondary: #252526;
      --bg-tertiary: #2d2d30;
      --text-primary: #e0e0e0;
      --text-secondary: #b4b4b4;
      --text-tertiary: #808080;
      --border-color: #3e3e42;
      --hover-bg: #2d2d30;
    }

    /* ============= Global Styles ============= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      line-height: var(--line-height-base);
      color: var(--text-primary);
      background: var(--bg-primary);
      overflow: hidden;
    }

    /* ============= Layout Structure (VS Code Style) ============= */
    #app {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      grid-template-rows: var(--header-height) 1fr;
      height: 100vh;
      width: 100vw;
    }

    /* Header */
    .header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 0 var(--spacing-md);
      gap: var(--spacing-md);
    }

    .header-title {
      font-size: var(--font-size-lg);
      font-weight: 600;
      color: var(--text-primary);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    /* Sidebar */
    .sidebar {
      grid-row: 2;
      grid-column: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      transition: width 0.3s ease;
      position: relative;
    }

    .sidebar-toggle {
      display: flex;
      align-items: center;
      height: 40px;
      line-height: 40px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 18px;
      color: var(--text-secondary);
      border: none;
      transition: background 0.2s;
    }

    .sidebar-toggle:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }

    .sidebar.collapsed {
      width: 50px;
    }

    .sidebar.collapsed .sidebar-section {
      padding: var(--spacing-sm) 0;
      align-items: center;
    }

    .sidebar.collapsed .sidebar-section-title {
      display: none;
    }

    .sidebar.collapsed .sidebar-item {
      padding: var(--spacing-md) var(--spacing-sm);
      margin: var(--spacing-xs) 0;
      text-align: center;
      font-size: 20px;
      width: 100%;
      justify-content: center;
      position: relative;
    }

    .sidebar.collapsed .sidebar-item-text {
      display: none;
    }

    .sidebar.collapsed .sidebar-item:hover::after {
      white-space: nowrap;
      font-size: var(--font-size-sm);
      z-index: 1000;
      color: var(--text-primary);
      pointer-events: none;
    }

    .sidebar.collapsed .button {
      padding: var(--spacing-md) var(--spacing-sm);
      text-align: center;
      font-size: 16px;
    }

    .sidebar.collapsed #mode-selector {
      display: none;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border-color);
      padding: var(--spacing-sm);
    }

    .sidebar-section-title {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      padding: var(--spacing-sm) var(--spacing-md);
      margin-top: var(--spacing-sm);
    }

    .sidebar-item {
      padding: var(--spacing-sm) var(--spacing-md);
      margin: var(--spacing-xs) 0;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.2s;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .sidebar-item-icon {
      flex-shrink: 0;
      font-size: 16px;
    }

    .sidebar-item-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }

    .sidebar-item[active] {
      border-left: 3px solid #0098ff;
    }

    /* Main Content Area */
    .main-content {
      grid-row: 2;
      grid-column: 2;
      display: grid;
      grid-template-columns: 1fr var(--editor-width);
      gap: 1px;
      background: var(--bg-tertiary);
    }

    /* Renderer Area */
    .renderer-area {
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }

    .renderer-tabs {
      display: flex;
      height: var(--tab-height);
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
      overflow-x: auto;
    }

    .renderer-tab {
      padding: 0 var(--spacing-lg);
      height: 100%;
      display: flex;
      align-items: center;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      font-size: var(--font-size-sm);
      white-space: nowrap;
      color: var(--text-secondary);
    }

    .renderer-tab:hover {
      background: var(--hover-bg);
    }

    .renderer-tab.active {
      border-bottom-color: var(--color-accent);
      color: var(--text-primary);
    }

    .renderer-content {
      flex: 1;
      overflow: auto;
      display: none;
    }

    .renderer-content.active {
      display: flex;
    }

    /* Renderers */
    #d3-renderer { 
      background: var(--bg-primary);
      width: 100%;
      height: 100%;
    }
    #tree-renderer { 
      background: var(--bg-primary);
      width: 100%;
      height: 100%;
    }
    #json-renderer { 
      background: var(--bg-primary);
      width: 100%;
      height: 100%;
    }
    
    /* Ensure renderer children use flex layout */
    .gs-d3-renderer,
    .gs-tree-renderer,
    .gs-json-renderer {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .gs-d3-renderer.active,
    .gs-tree-renderer.active,
    .gs-json-renderer.active {
      display: flex;
    }

    /* Control Panel */
    .control-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      overflow-y: auto;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--border-color);
    }

    .panel-title {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: var(--spacing-md);
    }

    /* ============= Components ============= */
    .button {
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      transition: background 0.2s;
      width: 100%;
      text-align: left;
      margin: var(--spacing-xs) 0;
    }

    .button:hover {
      background: var(--color-accent);
    }

    .button:disabled {
      background: var(--text-tertiary);
      cursor: not-allowed;
    }

    .button-group {
      display: flex;
      gap: var(--spacing-sm);
      margin: var(--spacing-md) 0;
    }

    .button-group .button {
      flex: 1;
      margin: 0;
    }

    .select, .input {
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      margin: var(--spacing-xs) 0;
      width: 100%;
    }

    .input:focus, .select:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 2px rgba(0, 152, 255, 0.1);
    }

    .label {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--text-secondary);
      margin: var(--spacing-sm) 0 var(--spacing-xs) 0;
      display: block;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: var(--spacing-sm);
    }

    .status-indicator.online {
      background: var(--color-success);
    }

    .status-indicator.offline {
      background: var(--color-error);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-sm);
      margin: var(--spacing-md) 0;
    }

    .stat {
      padding: var(--spacing-md);
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      text-align: center;
    }

    .stat-value {
      font-size: var(--font-size-lg);
      font-weight: 600;
      color: var(--color-accent);
    }

    .stat-label {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-top: var(--spacing-xs);
    }

    /* SVG for D3 Renderer */
    svg {
      background: var(--bg-primary);
    }

    .node {
      stroke: var(--border-color);
      stroke-width: 1.5px;
    }

    .node.selected {
      stroke: var(--color-accent);
      stroke-width: 3px;
    }

    .node-label {
      font-size: var(--font-size-sm);
      fill: var(--text-primary);
      pointer-events: none;
    }

    .link {
      stroke: var(--text-tertiary);
      stroke-width: 1px;
      opacity: 0.6;
    }

    /* Tree View */
    .tree-item {
      padding: var(--spacing-xs) var(--spacing-md);
      cursor: pointer;
      user-select: none;
      font-size: var(--font-size-sm);
      color: var(--text-primary);
      transition: background 0.2s;
    }

    .tree-item:hover {
      background: var(--hover-bg);
    }

    .tree-item.selected {
      background: rgba(0, 152, 255, 0.2);
      color: var(--color-accent);
    }

    /* JSON View */
    .json-view {
      padding: var(--spacing-md);
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      white-space: pre-wrap;
      overflow-wrap: break-word;
      color: var(--text-secondary);
    }

    .json-key { color: var(--color-info); }
    .json-string { color: var(--color-success); }
    .json-number { color: var(--color-warning); }
    .json-boolean { color: var(--color-primary); }

    /* Cassette Controls */
    .cassette-timeline {
      height: 20px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      position: relative;
      margin: var(--spacing-md) 0;
      cursor: pointer;
    }

    .cassette-progress {
      height: 100%;
      background: var(--color-accent);
      border-radius: var(--border-radius);
      width: 0%;
      transition: width 0.1s;
    }

    .cassette-frame {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: var(--spacing-sm);
      margin: var(--spacing-sm) 0;
      border-radius: var(--border-radius);
      font-size: var(--font-size-sm);
    }

    .cassette-frame.active {
      background: rgba(0, 152, 255, 0.1);
      border-color: var(--color-accent);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--text-tertiary);
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* Animations */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }

    .loading {
      animation: spin 1s linear infinite;
    }

    /* Utilities */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-1 { flex: 1; }
    .gap-sm { gap: var(--spacing-sm); }
    .gap-md { gap: var(--spacing-md); }
    .p-md { padding: var(--spacing-md); }
    .m-md { margin: var(--spacing-md); }
  </style>
</head>
<body>
  <!-- Main Application Container -->
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-title">📊 GraphSense - Universal Entity Explorer</div>
      <div class="header-controls">
        <select id="theme-selector" class="select" style="width: 120px;">
          <option value="light">☀️ Light</option>
          <option value="dark">🌙 Dark</option>
        </select>
        <button class="button" id="reset-btn" style="width: auto; padding: var(--spacing-sm) var(--spacing-lg); margin: 0;">Reset</button>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle Sidebar">☰</button>
      
      <div class="sidebar-section">
        <div class="sidebar-section-title">� Graphs</div>
        <div id="graphs-list" style="max-height: 200px; overflow-y: auto;"></div>
        <button class="button" id="new-graph-btn" style="font-size: var(--font-size-sm); margin-top: var(--spacing-sm);">➕ <span class="sidebar-item-text">New Graph</span></button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">🎬 Cassette</div>
        <button class="button" id="record-btn" style="font-size: var(--font-size-sm);">⏺️ <span class="sidebar-item-text">Start Recording</span></button>
        <button class="button" id="save-cassette-btn" disabled style="font-size: var(--font-size-sm);">💾 <span class="sidebar-item-text">Save Cassette</span></button>
        <button class="button" id="load-cassette-btn" style="font-size: var(--font-size-sm);">📂 <span class="sidebar-item-text">Load Cassette</span></button>
        <button class="button" id="play-btn" disabled style="font-size: var(--font-size-sm);">▶️ <span class="sidebar-item-text">Play</span></button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">⚙️ Mode</div>
        <select id="mode-selector" class="select">
          <option value="view">👁️ View</option>
          <option value="edit">✏️ Edit</option>
          <option value="annotate">📝 Annotate</option>
        </select>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">🔗 Status</div>
        <div style="padding: var(--spacing-md);">
          <span class="status-indicator online"></span>
          <span id="status-text" style="font-size: var(--font-size-sm);" class="sidebar-item-text">Online</span>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Renderer Area -->
      <div class="renderer-area">
        <div class="renderer-tabs">
          <div class="renderer-tab active" data-renderer="d3">Graph View</div>
          <div class="renderer-tab" data-renderer="tree">Tree View</div>
          <div class="renderer-tab" data-renderer="json">JSON View</div>
        </div>

        <!-- D3 Renderer -->
        <div id="d3-renderer" class="renderer-content active"></div>

        <!-- Tree Renderer -->
        <div id="tree-renderer" class="renderer-content"></div>

        <!-- JSON Renderer -->
        <div id="json-renderer" class="renderer-content"></div>
      </div>

      <!-- Control Panel -->
      <div class="control-panel">
        <!-- Operations Section -->
        <div class="panel-section">
          <div class="panel-title">Operations</div>
          <button class="button" id="add-entity-btn" style="font-size: var(--font-size-sm);">➕ Add Entity</button>
          <button class="button" id="add-relation-btn" disabled style="font-size: var(--font-size-sm);">🔗 Add Relation</button>
          <button class="button" id="undo-btn" disabled style="font-size: var(--font-size-sm);">↶ Undo</button>
          <button class="button" id="redo-btn" disabled style="font-size: var(--font-size-sm);">↷ Redo</button>
        </div>

        <!-- GitHub Import Section -->
        <div class="panel-section">
          <div class="panel-title">📦 GitHub Import</div>
          <div style="padding: var(--spacing-md);">
            <input type="text" 
                   id="github-token-input" 
                   placeholder="GitHub Token" 
                   style="width: 100%; padding: var(--spacing-sm); margin-bottom: var(--spacing-sm); 
                          border: 1px solid var(--border-color); border-radius: var(--border-radius); 
                          background: var(--bg-primary); color: var(--text-primary); 
                          font-size: var(--font-size-sm);" />
            <select id="github-source-type" 
                    style="width: 100%; padding: var(--spacing-sm); margin-bottom: var(--spacing-sm); 
                           border: 1px solid var(--border-color); border-radius: var(--border-radius); 
                           background: var(--bg-primary); color: var(--text-primary); 
                           font-size: var(--font-size-sm);">
              <option value="org">Organization</option>
              <option value="user">User</option>
            </select>
            <input type="text" 
                   id="github-name-input" 
                   placeholder="Username or Organization" 
                   style="width: 100%; padding: var(--spacing-sm); margin-bottom: var(--spacing-sm); 
                          border: 1px solid var(--border-color); border-radius: var(--border-radius); 
                          background: var(--bg-primary); color: var(--text-primary); 
                          font-size: var(--font-size-sm);" />
            <select id="github-import-type" 
                    style="width: 100%; padding: var(--spacing-sm); margin-bottom: var(--spacing-md); 
                           border: 1px solid var(--border-color); border-radius: var(--border-radius); 
                           background: var(--bg-primary); color: var(--text-primary); 
                           font-size: var(--font-size-sm);">
              <option value="info">Account Info</option>
              <option value="repos">Repositories</option>
              <option value="members">Members (org only)</option>
            </select>
            <button class="button" id="github-import-btn" 
                    style="width: 100%; font-size: var(--font-size-sm); margin-bottom: var(--spacing-sm);">
              🔄 Import Data
            </button>
            <div id="github-status" 
                 style="font-size: var(--font-size-sm); color: var(--text-secondary); 
                        padding: var(--spacing-sm); border-radius: var(--border-radius); 
                        background: var(--bg-tertiary); display: none;">
            </div>
          </div>
        </div>

        <!-- Statistics Section -->
        <div class="panel-section">
          <div class="panel-title">Statistics</div>
          <div class="stats">
            <div class="stat">
              <div class="stat-value" id="entity-count">0</div>
              <div class="stat-label">Entities</div>
            </div>
            <div class="stat">
              <div class="stat-value" id="relation-count">0</div>
              <div class="stat-label">Relations</div>
            </div>
          </div>
        </div>

        <!-- Selection Section -->
        <div class="panel-section">
          <div class="panel-title">Selection</div>
          <div id="selection-info" style="font-size: var(--font-size-sm); color: var(--text-secondary); padding: var(--spacing-md);">
            <em>No selection</em>
          </div>
        </div>

        <!-- Cassette Playback Section -->
        <div class="panel-section">
          <div class="panel-title">Playback</div>
          <div class="cassette-timeline">
            <div class="cassette-progress" id="cassette-progress"></div>
          </div>
          <div style="font-size: var(--font-size-sm); color: var(--text-secondary);">
            Frame: <span id="current-frame">0</span> / <span id="total-frames">0</span>
          </div>
          <div id="cassette-frame-display" style="margin-top: var(--spacing-md); font-size: var(--font-size-sm); color: var(--text-secondary);">
            <em>No playback</em>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { Graph } from './src/core/graph.js';
    import { Schema } from './src/core/schema.js';
    import { EventBus } from './src/core/event/bus.js';
    import { QueryEngine } from './src/core/query-engine.js';
    import { UndoRedoManager } from './src/core/undo-redo.js';
    import { AnnotationService } from './src/services/annotation-service.js';
    import { CassettePlayer } from './src/services/cassette-player.js';
    import { UIBridge } from './src/ui/bridge.js';
    import { JSONRenderer } from './src/ui/renderers/json-renderer.js';
    import { TreeRenderer } from './src/ui/renderers/tree-renderer.js';
    import { D3Renderer } from './src/ui/renderers/d3-renderer.js';
    import GitHubAdapter from './src/adapters/data/github-adapter.js';

    // ============= Graph Manager =============
    class GraphManager {
      constructor() {
        this.graphs = new Map();
        this.activeGraphId = null;
      }

      createGraph(name, id = null) {
        const graphId = id || `graph-${Date.now()}`;
        const eventBus = new EventBus();
        const schema = new Schema();
        const graph = new Graph(eventBus, schema);
        
        this.graphs.set(graphId, {
          id: graphId,
          name: name,
          graph: graph,
          eventBus: eventBus,
          schema: schema,
          queryEngine: new QueryEngine(graph),
          undoRedo: new UndoRedoManager(graph, eventBus),
          annotationService: new AnnotationService(graph, eventBus),
          cassettePlayer: new CassettePlayer(graph, eventBus),
          uiBridge: new UIBridge(graph, eventBus),
          createdAt: new Date()
        });
        
        return graphId;
      }

      getGraph(id) {
        return this.graphs.get(id);
      }

      getActiveGraph() {
        return this.graphs.get(this.activeGraphId);
      }

      setActiveGraph(id) {
        if (this.graphs.has(id)) {
          this.activeGraphId = id;
          return true;
        }
        return false;
      }

      deleteGraph(id) {
        if (id === this.activeGraphId) return false;
        return this.graphs.delete(id);
      }

      listGraphs() {
        return Array.from(this.graphs.values());
      }
    }

    // ============= Initialize System =============
    const graphManager = new GraphManager();
    
    // Create default graph
    const defaultGraphId = graphManager.createGraph('Sample Data');
    graphManager.setActiveGraph(defaultGraphId);
    
    // Helper functions to get active graph components
    const getActiveGraph = () => graphManager.getActiveGraph().graph;
    const getActiveEventBus = () => graphManager.getActiveGraph().eventBus;
    const getActiveSchema = () => graphManager.getActiveGraph().schema;
    const getActiveQueryEngine = () => graphManager.getActiveGraph().queryEngine;
    const getActiveUndoRedo = () => graphManager.getActiveGraph().undoRedo;
    
    // Legacy references (for backward compatibility)
    const eventBus = getActiveEventBus();
    const schema = getActiveSchema();

    // Register entity types
    schema.registerEntityType('person', {
      name: { type: 'string', required: true },
      role: { type: 'string', required: false },
      email: { type: 'string', required: false }
    });
    schema.registerEntityType('project', {
      title: { type: 'string', required: true },
      status: { type: 'string', required: false },
      repository: { type: 'string', required: false }
    });
    schema.registerEntityType('team', {
      name: { type: 'string', required: true },
      description: { type: 'string', required: false }
    });
    
    // Note: GitHub entity types (organization, repository, user) and OWNS relation
    // are already registered by Schema's _loadDefaults() method

    // Register custom relation types (GitHub types are already registered)
    schema.registerRelationType('works_on', {
      role: { type: 'string', required: false }
    });
    schema.registerRelationType('belongs_to', {});
    schema.registerRelationType('manages', {});
    
    // Initialize GitHub adapter (will be configured with token later)
    let githubAdapter = null;

    // ============= UI State =============
    let currentRenderer = 'd3';
    let recordedFrames = [];
    let isRecording = false;
    let recordingStartTime = 0;
    let selectedEntity = null;

    // ============= Initialize Renderers =============
    const d3Container = document.getElementById('d3-renderer');
    const treeContainer = document.getElementById('tree-renderer');
    const jsonContainer = document.getElementById('json-renderer');

    const d3Renderer = new D3Renderer({ theme: 'light', mode: 'view' });
    d3Renderer.init(d3Container, { theme: 'light', mode: 'view' });
    
    const treeRenderer = new TreeRenderer({ theme: 'light', mode: 'view' });
    treeRenderer.init(treeContainer, { theme: 'light', mode: 'view' });
    
    const jsonRenderer = new JSONRenderer({ theme: 'light', mode: 'view' });
    jsonRenderer.init(jsonContainer, { theme: 'light', mode: 'view' });

    const renderers = {
      d3: d3Renderer,
      tree: treeRenderer,
      json: jsonRenderer
    };

    // ============= Create Sample Data =============
    function createSampleData() {
      const activeGraph = getActiveGraph();
      const activeAnnotationService = graphManager.getActiveGraph().annotationService;
      
      // People
      activeGraph.addEntity({
        id: 'person_alice',
        type: 'person',
        metadata: { name: 'Alice Chen', role: 'Lead Developer', email: 'alice@example.com' }
      });
      activeGraph.addEntity({
        id: 'person_bob',
        type: 'person',
        metadata: { name: 'Bob Smith', role: 'Designer', email: 'bob@example.com' }
      });
      activeGraph.addEntity({
        id: 'person_carol',
        type: 'person',
        metadata: { name: 'Carol Davis', role: 'Product Manager', email: 'carol@example.com' }
      });

      // Projects
      activeGraph.addEntity({
        id: 'project_graphsense',
        type: 'project',
        metadata: { title: 'GraphSense', status: 'active', repository: 'graphsense' }
      });
      activeGraph.addEntity({
        id: 'project_dataviz',
        type: 'project',
        metadata: { title: 'DataViz Platform', status: 'active', repository: 'dataviz' }
      });

      // Team
      activeGraph.addEntity({
        id: 'team_platform',
        type: 'team',
        metadata: { name: 'Platform Team', description: 'Core infrastructure' }
      });

      // Relations
      activeGraph.addRelation({
        id: 'rel_alice_gs',
        type: 'works_on',
        from: 'person_alice',
        to: 'project_graphsense',
        metadata: { role: 'Engineer' }
      });
      activeGraph.addRelation({
        id: 'rel_bob_gs',
        type: 'works_on',
        from: 'person_bob',
        to: 'project_graphsense',
        metadata: { role: 'Designer' }
      });
      activeGraph.addRelation({
        id: 'rel_alice_dv',
        type: 'works_on',
        from: 'person_alice',
        to: 'project_dataviz',
        metadata: { role: 'Lead' }
      });
      activeGraph.addRelation({
        id: 'rel_team',
        type: 'belongs_to',
        from: 'person_alice',
        to: 'team_platform',
        metadata: {}
      });

      // Annotations
      activeAnnotationService.addNote('project_graphsense', 'Core entity graph system');
      activeAnnotationService.addTag('project_graphsense', 'critical');
      activeAnnotationService.addTag('project_graphsense', 'active');
    }

    createSampleData();
    graphManager.getActiveGraph().uiBridge.setRenderer(d3Renderer);

    // ============= Graph List UI Management =============
    function updateGraphsList() {
      const graphsList = document.getElementById('graphs-list');
      graphsList.innerHTML = '';
      
      graphManager.listGraphs().forEach(graphData => {
        const item = document.createElement('div');
        item.className = 'sidebar-item';
        item.style.cursor = 'pointer';
        item.style.display = 'flex';
        item.style.justifyContent = 'space-between';
        item.style.alignItems = 'center';
        item.style.padding = 'var(--spacing-sm)';
        
        if (graphData.id === graphManager.activeGraphId) {
          item.setAttribute('active', '');
        }
        
        const textSpan = document.createElement('span');
        textSpan.className = 'sidebar-item-text';
        textSpan.textContent = graphData.name;
        textSpan.style.flex = '1';
        textSpan.style.overflow = 'hidden';
        textSpan.style.textOverflow = 'ellipsis';
        textSpan.style.whiteSpace = 'nowrap';
        
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '✕';
        deleteBtn.style.border = 'none';
        deleteBtn.style.background = 'transparent';
        deleteBtn.style.color = 'var(--text-secondary)';
        deleteBtn.style.cursor = 'pointer';
        deleteBtn.style.padding = '2px 6px';
        deleteBtn.style.marginLeft = 'var(--spacing-sm)';
        deleteBtn.title = 'Delete graph';
        
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (graphManager.listGraphs().length === 1) {
            alert('Cannot delete the last graph');
            return;
          }
          if (confirm(`Delete graph "${graphData.name}"?`)) {
            if (graphData.id === graphManager.activeGraphId) {
              // Switch to another graph first
              const otherGraph = graphManager.listGraphs().find(g => g.id !== graphData.id);
              graphManager.setActiveGraph(otherGraph.id);
            }
            graphManager.deleteGraph(graphData.id);
            updateGraphsList();
            renderAll();
          }
        });
        
        item.appendChild(textSpan);
        if (graphManager.listGraphs().length > 1) {
          item.appendChild(deleteBtn);
        }
        
        item.addEventListener('click', () => {
          graphManager.setActiveGraph(graphData.id);
          updateGraphsList();
          renderAll();
        });
        
        graphsList.appendChild(item);
      });
    }

    // Initialize graphs list
    updateGraphsList();

    // ============= Event Handlers =============

    // Sidebar toggle
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
      // Save preference to localStorage
      const isCollapsed = sidebar.classList.contains('collapsed');
      localStorage.setItem('sidebarCollapsed', isCollapsed);
    });

    // Restore sidebar state from localStorage
    if (localStorage.getItem('sidebarCollapsed') === 'true') {
      document.getElementById('sidebar').classList.add('collapsed');
    }

    // Render the initial state
    function renderAll() {
      const activeGraph = getActiveGraph();
      const graphData = activeGraph.serialize();
      d3Renderer.render(graphData);
      treeRenderer.render(graphData);
      jsonRenderer.render(graphData);
      updateStats();
    }

    function updateStats() {
      const activeGraph = getActiveGraph();
      document.getElementById('entity-count').textContent = activeGraph.entities.size;
      document.getElementById('relation-count').textContent = activeGraph.relations.size;
    }

    // Theme selector
    document.getElementById('theme-selector').addEventListener('change', (e) => {
      const theme = e.target.value;
      if (theme === 'dark') {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
      // Update all renderers with new theme
      Object.values(renderers).forEach(r => r.setTheme(theme));
    });

    // Renderer switcher (via tabs)
    document.querySelectorAll('.renderer-tab').forEach(el => {
      el.addEventListener('click', () => {
        const renderer = el.dataset.renderer;
        currentRenderer = renderer;
        // Update tab highlights
        document.querySelectorAll('.renderer-tab').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        // Show active renderer
        document.querySelectorAll('.renderer-content').forEach(e => e.classList.remove('active'));
        document.getElementById(`${renderer}-renderer`).classList.add('active');
        renderAll();
      });
    });

    // Mode selector
    document.getElementById('mode-selector').addEventListener('change', (e) => {
      const mode = e.target.value;
      graphManager.getActiveGraph().uiBridge.setMode(mode);
      Object.values(renderers).forEach(r => r.setMode(mode));
    });

    // New graph button
    document.getElementById('new-graph-btn').addEventListener('click', () => {
      const name = prompt('Enter graph name:');
      if (name && name.trim()) {
        const newGraphId = graphManager.createGraph(name.trim());
        graphManager.setActiveGraph(newGraphId);
        updateGraphsList();
        renderAll();
      }
    });

    // Add entity
    let entityCounter = 0;
    document.getElementById('add-entity-btn').addEventListener('click', () => {
      entityCounter++;
      const entity = {
        id: `entity_${entityCounter}`,
        type: 'person',
        metadata: { name: `Person ${entityCounter}`, role: 'Team Member' }
      };
      getActiveGraph().addEntity(entity);
      renderAll();
      if (isRecording) {
        recordedFrames.push({
          type: 'entity.add',
          timestamp: Date.now() - recordingStartTime,
          data: entity
        });
      }
    });

    // GitHub Import
    document.getElementById('github-import-btn').addEventListener('click', async () => {
      const token = document.getElementById('github-token-input').value.trim();
      const sourceType = document.getElementById('github-source-type').value;
      const name = document.getElementById('github-name-input').value.trim();
      const importType = document.getElementById('github-import-type').value;
      const statusEl = document.getElementById('github-status');
      
      if (!token) {
        statusEl.textContent = '⚠️ Please enter a GitHub token';
        statusEl.style.display = 'block';
        statusEl.style.color = 'var(--color-error)';
        return;
      }
      
      if (!name) {
        statusEl.textContent = '⚠️ Please enter a username or organization name';
        statusEl.style.display = 'block';
        statusEl.style.color = 'var(--color-error)';
        return;
      }
      
      try {
        // Initialize adapter with token
        githubAdapter = new GitHubAdapter(token);
        
        statusEl.textContent = '🔄 Importing data...';
        statusEl.style.display = 'block';
        statusEl.style.color = 'var(--text-secondary)';
        
        // Build query based on source type and import type
        let query = {};
        if (sourceType === 'org') {
          query.org = name;
          if (importType === 'info') {
            query.type = 'org';
          } else if (importType === 'repos') {
            query.type = 'repos';
          } else if (importType === 'members') {
            query.type = 'users';
          }
        } else {
          // User repositories
          query.user = name;
          if (importType === 'info') {
            query.type = 'user-info';
          } else if (importType === 'repos') {
            query.type = 'user-repos';
          }
        }
        
        // Fetch data from GitHub
        const rawData = await githubAdapter.fetch(query);
        
        // Create a new graph for the imported data
        const graphName = `${sourceType === 'org' ? 'Org' : 'User'}: ${name}`;
        const newGraphId = graphManager.createGraph(graphName);
        const newGraphData = graphManager.getGraph(newGraphId);
        
        // Map to entities and relations
        const { entities, relations } = await githubAdapter.map(rawData, newGraphData.schema);
        
        // Add to new graph
        let entityCount = 0;
        let relationCount = 0;
        
        entities.forEach(entity => {
          try {
            newGraphData.graph.addEntity(entity);
            entityCount++;
          } catch (error) {
            console.warn('Failed to add entity:', entity.id, error);
          }
        });
        
        relations.forEach(relation => {
          try {
            newGraphData.graph.addRelation(relation);
            relationCount++;
          } catch (error) {
            console.warn('Failed to add relation:', relation.id, error);
          }
        });
        
        // Switch to the new graph
        graphManager.setActiveGraph(newGraphId);
        updateGraphsList();
        
        // Update UI
        renderAll();
        
        statusEl.textContent = `✅ Imported ${entityCount} entities and ${relationCount} relations`;
        statusEl.style.color = 'var(--color-success)';
        
        // Auto-hide success message after 3 seconds
        setTimeout(() => {
          statusEl.style.display = 'none';
        }, 3000);
        
      } catch (error) {
        console.error('GitHub import error:', error);
        statusEl.textContent = `❌ Error: ${error.message || 'Failed to import'}`;
        statusEl.style.display = 'block';
        statusEl.style.color = 'var(--color-error)';
      }
    });

    // Undo/Redo
    document.getElementById('undo-btn').addEventListener('click', () => {
      getActiveUndoRedo().undo();
      renderAll();
    });

    document.getElementById('redo-btn').addEventListener('click', () => {
      getActiveUndoRedo().redo();
      renderAll();
    });

    // Cassette recording
    document.getElementById('record-btn').addEventListener('click', function() {
      if (!isRecording) {
        isRecording = true;
        recordedFrames = [];
        recordingStartTime = Date.now();
        this.textContent = '⏸️ Stop Recording';
        document.getElementById('save-cassette-btn').disabled = false;
      } else {
        isRecording = false;
        this.textContent = '⏺️ Start Recording';
      }
    });

    document.getElementById('save-cassette-btn').addEventListener('click', () => {
      const cassette = {
        id: 'cassette-' + Date.now(),
        title: 'Recorded Session',
        description: `${recordedFrames.length} frames recorded`,
        frames: recordedFrames
      };
      console.log('Cassette saved:', cassette);
      alert(`Cassette saved with ${recordedFrames.length} frames!`);
      graphManager.getActiveGraph().cassettePlayer.load(cassette);
      document.getElementById('play-btn').disabled = false;
    });

    document.getElementById('play-btn').addEventListener('click', () => {
      const cassettePlayer = graphManager.getActiveGraph().cassettePlayer;
      if (cassettePlayer.isPlaying()) {
        cassettePlayer.stop();
        document.getElementById('play-btn').textContent = '▶️ Play';
      } else {
        cassettePlayer.play();
        document.getElementById('play-btn').textContent = '⏹️ Stop';
      }
    });

    // Reset
    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm('Reset current graph?')) {
        getActiveGraph().reset();
        recordedFrames = [];
        isRecording = false;
        selectedEntity = null;
        document.getElementById('record-btn').textContent = '⏺️ Start Recording';
        document.getElementById('play-btn').textContent = '▶️ Play';
        createSampleData();
        renderAll();
      }
    });

    // Listen to graph events
    eventBus.subscribe('*', (event) => {
      if (isRecording && event.type !== 'annotation' && event.type !== 'cassette') {
        recordedFrames.push({
          type: event.type,
          timestamp: Date.now() - recordingStartTime,
          data: event.data
        });
      }
    });

    // Cassette playback events
    eventBus.subscribe('cassette.frame.enter', (event) => {
      const totalFrames = cassettePlayer.getCurrentCassette()?.frames.length || 0;
      document.getElementById('current-frame').textContent = event.data.frameIndex + 1;
      document.getElementById('total-frames').textContent = totalFrames;
      const progress = ((event.data.frameIndex + 1) / totalFrames) * 100;
      document.getElementById('cassette-progress').style.width = `${progress}%`;
    });

    // Initial render
    renderAll();


    console.log('GraphSense initialized. Access via window.GS');
  </script>
</body>
</html>
